name: Apply customer subpoint consistency fix

on:
  push:
    branches:
      - fix/customer-subpoints-consistency
    paths:
      - .github/workflows/apply-customer-subpoints-consistency.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-subpoints-consistency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply targeted patch
        run: python3 .github/scripts/apply-customer-subpoints-consistency.py

      - name: Install dependencies without lockfile mutation
        run: npm install --ignore-scripts --package-lock=false

      - name: Regression test
        run: npx vitest run src/lib/__tests__/nutrition-tracker-targets.logic.test.ts src/lib/__tests__/customer-subpoints-consistency.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Remove temporary automation
        run: |
          rm -f .github/scripts/apply-customer-subpoints-consistency.py
          rm -f .github/workflows/apply-customer-subpoints-consistency.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unify coach customer target and insight sources"
          git push origin HEAD:fix/customer-subpoints-consistency
