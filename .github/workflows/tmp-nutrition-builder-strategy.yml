name: Temporary nutrition builder strategy verification

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Strategy regression tests
        run: npx vitest run src/features/nutrition-plan-builder/lib/__tests__/auto-fill-strategy.test.ts src/features/nutrition-plan-builder/lib/__tests__/plan-builder.logic.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
