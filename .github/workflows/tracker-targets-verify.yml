name: Tracker targets verification

on:
  push:
    branches:
      - fix/tracker-active-plan-targets

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Tracker target regression tests
        run: npx vitest run src/lib/__tests__/nutrition-tracker-targets.logic.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
