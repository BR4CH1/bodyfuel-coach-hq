name: Verify MCP training plan writes

on:
  push:
    branches:
      - feature/mcp-training-plan-writes

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Targeted MCP tests
        run: npx vitest run src/lib/mcp/__tests__/coach-access.test.ts src/lib/mcp/__tests__/coach-training-plan-write.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check HEAD~1 HEAD
