name: Temporary legacy plan builder verifier

on:
  push:
    branches:
      - fix/plan-builder-legacy-draft-amounts

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[legacy hotfix applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan-builder-legacy-draft-amounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply focused compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/plan-builder.functions.ts')
          text = path.read_text()

          anchor = 'import type { TrainingWeekSchedule } from "@/lib/training-schedule.logic";\n'
          added = anchor + 'import { normalizeBuilderIngredientsForSave } from "@/features/nutrition-plan-builder/lib/ingredient-save.logic";\n'
          if added not in text:
              if anchor not in text: raise SystemExit('import anchor missing')
              text = text.replace(anchor, added, 1)

          type_anchor = '''  /** Explizite Menge aus der Food-DB-Auswahl; bei Legacy-/Bibliothekszutaten optional. */\n  amount?: number | null;\n'''
          type_added = '''  /** Legacy-Auto-Drafts können noch das frühere Bibliotheksfeld enthalten. */\n  amount_g?: number | null;\n''' + type_anchor
          if type_added not in text:
              if type_anchor not in text: raise SystemExit('type anchor missing')
              text = text.replace(type_anchor, type_added, 1)

          old = '''              ingredients: m.ingredients.map((i) => {\n                const explicitAmount = Number(i.amount ?? 0);\n                if (\n                  (i.unit === "g" || i.unit === "ml") &&\n                  Number.isFinite(explicitAmount) &&\n                  explicitAmount > 0\n                ) {\n                  return {\n                    name: i.name,\n                    amount: Math.round(explicitAmount * f),\n                    unit: i.unit,\n                  };\n                }\n                return {\n                  name: i.name,\n                  grams: Math.round((i.grams ?? 0) * f),\n                };\n              }),\n'''
          new = '''              ingredients: normalizeBuilderIngredientsForSave(m.ingredients, f),\n'''
          if new not in text:
              if old not in text: raise SystemExit('mapping anchor missing')
              text = text.replace(old, new, 1)
          path.write_text(text)

          Path('src/features/nutrition-plan-builder/lib/ingredient-save.logic.ts').write_text('''export type BuilderIngredientSaveInput = {\n  name: string;\n  grams?: number | null;\n  amount_g?: number | null;\n  amount?: number | null;\n  unit?: "g" | "ml" | null;\n};\n\nexport type BuilderIngredientSaveOutput =\n  | { name: string; grams: number }\n  | { name: string; amount: number; unit: "g" | "ml" };\n\nfunction positive(value: unknown): number | null {\n  const parsed = Number(value);\n  return Number.isFinite(parsed) && parsed > 0 ? parsed : null;\n}\n\n/**\n * Normalisiert Zutaten direkt vor dem Builder-Publish.\n * Explizite g/ml-Mengen aus der Food-DB bleiben erhalten. Fehlt `grams` in\n * einem älteren Browser-Auto-Draft, wird das frühere `amount_g`/`amount`\n * übernommen. Ein explizites `grams=0` vom Makro-Optimizer wird dagegen nicht\n * durch einen alten Basiswert wiederbelebt, sondern sauber ausgelassen.\n */\nexport function normalizeBuilderIngredientsForSave(\n  ingredients: readonly BuilderIngredientSaveInput[],\n  portionFactor = 1,\n): BuilderIngredientSaveOutput[] {\n  const factor = positive(portionFactor) ?? 1;\n  const output: BuilderIngredientSaveOutput[] = [];\n\n  for (const ingredient of ingredients) {\n    const name = String(ingredient.name ?? "").trim();\n    if (!name) continue;\n\n    const explicitAmount = positive(ingredient.amount);\n    if ((ingredient.unit === "g" || ingredient.unit === "ml") && explicitAmount) {\n      const amount = Math.round(explicitAmount * factor);\n      if (amount > 0) output.push({ name, amount, unit: ingredient.unit });\n      continue;\n    }\n\n    const hasCurrentGrams =\n      ingredient.grams !== null &&\n      ingredient.grams !== undefined &&\n      Number.isFinite(Number(ingredient.grams));\n    const sourceAmount = hasCurrentGrams\n      ? Math.max(0, Number(ingredient.grams))\n      : positive(ingredient.amount_g) ?? explicitAmount ?? 0;\n    const grams = Math.round(sourceAmount * factor);\n    if (grams > 0) output.push({ name, grams });\n  }\n\n  return output;\n}\n''')

          Path('src/features/nutrition-plan-builder/lib/ingredient-save.logic.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { normalizeBuilderIngredientsForSave } from "./ingredient-save.logic";\n\ndescribe("normalizeBuilderIngredientsForSave", () => {\n  it("publishes Reis, Honig und Zimt with current grams", () => {\n    expect(normalizeBuilderIngredientsForSave([\n      { name: "Reis (roh)", grams: 80 },\n      { name: "Honig", grams: 10 },\n      { name: "Zimt", grams: 2 },\n    ])).toEqual([\n      { name: "Reis (roh)", grams: 80 },\n      { name: "Honig", grams: 10 },\n      { name: "Zimt", grams: 2 },\n    ]);\n  });\n\n  it("recovers legacy amount_g auto-drafts", () => {\n    expect(normalizeBuilderIngredientsForSave([\n      { name: "Reis (roh)", amount_g: 80 },\n      { name: "Honig", amount_g: 10 },\n      { name: "Zimt", amount_g: 2 },\n    ])).toEqual([\n      { name: "Reis (roh)", grams: 80 },\n      { name: "Honig", grams: 10 },\n      { name: "Zimt", grams: 2 },\n    ]);\n  });\n\n  it("preserves explicit ml from the Food DB", () => {\n    expect(normalizeBuilderIngredientsForSave([\n      { name: "Milch 1,5%", grams: 206, amount: 200, unit: "ml" },\n    ])).toEqual([{ name: "Milch 1,5%", amount: 200, unit: "ml" }]);\n  });\n\n  it("does not revive an ingredient explicitly optimized to zero", () => {\n    expect(normalizeBuilderIngredientsForSave([\n      { name: "Reis (roh)", grams: 0, amount_g: 80 },\n      { name: "Hähnchenbrust", grams: 180 },\n    ])).toEqual([{ name: "Hähnchenbrust", grams: 180 }]);\n  });\n\n  it("applies portion scaling after legacy recovery", () => {\n    expect(normalizeBuilderIngredientsForSave([\n      { name: "Reis (roh)", amount_g: 80 },\n      { name: "Zimt", grams: 2 },\n    ], 0.5)).toEqual([\n      { name: "Reis (roh)", grams: 40 },\n      { name: "Zimt", grams: 1 },\n    ]);\n  });\n});\n''')
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Focused regression
        run: npx vitest run src/features/nutrition-plan-builder/lib/ingredient-save.logic.test.ts src/lib/__tests__/nutrition-ingredient-units.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff sanity
        run: git diff --check
      - name: Commit verified compatibility fix
        shell: bash
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          git config user.name "BodyFuel CI"
          git config user.email "bodyfuel-ci@users.noreply.github.com"
          git add src/lib/plan-builder.functions.ts \
            src/features/nutrition-plan-builder/lib/ingredient-save.logic.ts \
            src/features/nutrition-plan-builder/lib/ingredient-save.logic.test.ts
          git commit -m "fix: recover legacy plan builder ingredient amounts [legacy hotfix applied]"
          git push origin HEAD:fix/plan-builder-legacy-draft-amounts
