name: Customer coach cockpit build

on:
  push:
    branches:
      - feature/customer-coach-cockpit

permissions:
  contents: write

jobs:
  build-cockpit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-coach-cockpit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply customer cockpit refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/coach.customers.$userId.tsx')
          text = path.read_text()

          old_state = '''  const [newPw, setNewPw] = useState("");
  const [showPwForm, setShowPwForm] = useState(false);
  const [showDangerZone, setShowDangerZone] = useState(false);
'''
          new_state = '''  const [newPw, setNewPw] = useState("");
  const [showPwForm, setShowPwForm] = useState(false);
  const [showDangerZone, setShowDangerZone] = useState(false);
  const [activeTab, setActiveTab] = useState<
    "overview" | "ernaehrung" | "training" | "fortschritt" | "messages" | "verwaltung"
  >("overview");
'''
          assert old_state in text, 'state anchor not found'
          text = text.replace(old_state, new_state, 1)

          old_latest = '''  const latestWeightMeasurement = data.measurements?.find((item: any) => item.weight_kg != null) ?? null;

  return (
'''
          new_latest = '''  const latestWeightMeasurement = data.measurements?.find((item: any) => item.weight_kg != null) ?? null;
  const weightMeasurements = (data.measurements ?? []).filter((item: any) => item.weight_kg != null);
  const currentWeight = latestWeightMeasurement?.weight_kg != null ? Number(latestWeightMeasurement.weight_kg) : null;
  const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const comparisonWeight =
    weightMeasurements.find((item: any) => new Date(item.measured_at).getTime() <= thirtyDaysAgo) ??
    (weightMeasurements.length > 1 ? weightMeasurements[weightMeasurements.length - 1] : null);
  const weightDelta30 =
    currentWeight != null && comparisonWeight?.weight_kg != null
      ? currentWeight - Number(comparisonWeight.weight_kg)
      : null;
  const lastActivityIso = (data.auth as any)?.last_activity_at ?? data.auth?.last_sign_in_at ?? null;
  const lastActivityDate = lastActivityIso ? new Date(lastActivityIso) : null;
  const inactiveDays = lastActivityDate
    ? Math.max(0, Math.floor((Date.now() - lastActivityDate.getTime()) / (24 * 60 * 60 * 1000)))
    : null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const nextCheckinDate = (data as any).next_checkin_date ? new Date(`${(data as any).next_checkin_date}T00:00:00`) : null;
  const checkinDays = nextCheckinDate
    ? Math.ceil((nextCheckinDate.getTime() - today.getTime()) / (24 * 60 * 60 * 1000))
    : null;
  const packageEndDate = activePkg?.end_date ? new Date(`${activePkg.end_date}T00:00:00`) : null;
  const packageDaysLeft = packageEndDate
    ? Math.ceil((packageEndDate.getTime() - today.getTime()) / (24 * 60 * 60 * 1000))
    : null;
  const tabSections =
    activeTab === "ernaehrung"
      ? ["ernaehrung"]
      : activeTab === "training"
        ? ["training"]
        : activeTab === "fortschritt"
          ? ["fortschritt"]
          : activeTab === "messages"
            ? ["messages"]
            : activeTab === "verwaltung"
              ? ["stammdaten", "mitgliedschaft", "partner"]
              : [];
  const focusItems: Array<{
    title: string;
    detail: string;
    tab: typeof activeTab;
    action: string;
    tone: "warning" | "neutral";
  }> = [];

  if (radarStatus && radarStatus.level !== "green") {
    focusItems.push({
      title: "Coach-Radar",
      detail: radarStatus.primary_reason,
      tab: "fortschritt",
      action: "Prüfen",
      tone: "warning",
    });
  }
  if (checkinDays != null && checkinDays <= 0) {
    focusItems.push({
      title: checkinDays < 0 ? "Check-in überfällig" : "Check-in heute",
      detail: checkinDays < 0 ? `Seit ${Math.abs(checkinDays)} Tag${Math.abs(checkinDays) === 1 ? "" : "en"} fällig.` : "Heute ist der nächste Check-in geplant.",
      tab: "fortschritt",
      action: "Check-ins öffnen",
      tone: "warning",
    });
  }
  if (packageDaysLeft != null && packageDaysLeft <= 7) {
    focusItems.push({
      title: packageDaysLeft < 0 ? "Paket abgelaufen" : "Paket läuft bald aus",
      detail: packageDaysLeft < 0 ? `Seit ${Math.abs(packageDaysLeft)} Tag${Math.abs(packageDaysLeft) === 1 ? "" : "en"} abgelaufen.` : `Noch ${packageDaysLeft} Tag${packageDaysLeft === 1 ? "" : "e"} Laufzeit.`,
      tab: "verwaltung",
      action: "Mitgliedschaft öffnen",
      tone: "warning",
    });
  }
  if (inactiveDays != null && inactiveDays >= 5) {
    focusItems.push({
      title: "Kunde länger inaktiv",
      detail: `Letzte Aktivität vor ${inactiveDays} Tagen.`,
      tab: "messages",
      action: "Nachricht senden",
      tone: "warning",
    });
  }
  const visibleFocusItems = focusItems.slice(0, 3);

  return (
'''
          assert old_latest in text, 'latest measurement anchor not found'
          text = text.replace(old_latest, new_latest, 1)

          header_pattern = re.compile(
            r'''      <div>\n        <p className="text-xs uppercase tracking-\[0\.2em\] text-muted-foreground">Kunde</p>.*?      </div>\n\n      <Accordion type="multiple" defaultValue=\{\["stammdaten"\]\} className="space-y-3">''',
            re.S,
          )
          new_header = '''      <div className="space-y-4">
        <Link
          to="/coach/customers"
          className="inline-flex text-xs font-semibold uppercase tracking-[0.16em] text-muted-foreground transition-colors hover:text-foreground"
        >
          ← Kunden
        </Link>
        <div className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p className="text-xs uppercase tracking-[0.2em] text-muted-foreground">Coach Cockpit</p>
            <div className="mt-1 flex flex-wrap items-center gap-3">
              <h1 className="font-display text-3xl font-bold">
                {data.profile?.display_name ?? data.email}
              </h1>
              {radarStatus && <CustomerStatusBadge level={radarStatus.level} size="md" showLabel />}
            </div>
            <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-sm text-muted-foreground">
              <span>{data.email}</span>
              {data.profile?.phone && <span>{data.profile.phone}</span>}
              {activePkg && (
                <span>
                  {activePkg.package === "coaching" ? "BodyFuel Coaching" : activePkg.package === "smart" ? "BodyFuel Smart" : activePkg.package}
                  {activePkg.end_date ? ` · bis ${new Date(`${activePkg.end_date}T00:00:00`).toLocaleDateString("de-DE")}` : ""}
                </span>
              )}
            </div>
          </div>
          <div className="flex flex-wrap gap-2">
            <Button type="button" variant="outline" size="sm" onClick={() => setActiveTab("messages")}>
              Nachricht
            </Button>
            <Button type="button" size="sm" onClick={() => setActiveTab("fortschritt")} className="bg-gradient-gold text-primary-foreground">
              Check-ins & Fortschritt
            </Button>
          </div>
        </div>
      </div>

      <nav className="sticky top-2 z-20 -mx-1 overflow-x-auto rounded-2xl border border-border bg-background/95 p-1 shadow-sm backdrop-blur">
        <div className="flex min-w-max gap-1">
          {([
            ["overview", "Übersicht"],
            ["ernaehrung", "Ernährung"],
            ["training", "Training"],
            ["fortschritt", "Fortschritt"],
            ["messages", "Kommunikation"],
            ["verwaltung", "Verwaltung"],
          ] as const).map(([key, label]) => (
            <button
              key={key}
              type="button"
              onClick={() => setActiveTab(key)}
              className={`rounded-xl px-3 py-2 text-xs font-semibold transition-colors ${
                activeTab === key
                  ? "bg-foreground text-background"
                  : "text-muted-foreground hover:bg-secondary hover:text-foreground"
              }`}
            >
              {label}
            </button>
          ))}
        </div>
      </nav>

      {activeTab === "overview" && (
        <div className="space-y-6">
          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <CockpitStat
              label="Gewicht"
              value={currentWeight != null ? `${currentWeight.toLocaleString("de-DE")} kg` : "—"}
              hint={
                weightDelta30 != null
                  ? `${weightDelta30 > 0 ? "+" : ""}${weightDelta30.toLocaleString("de-DE", { maximumFractionDigits: 1 })} kg im Vergleich`
                  : "Noch kein Verlauf"
              }
            />
            <CockpitStat
              label="Ziel"
              value={(data.profile as any)?.goal_weight_kg ? `${(data.profile as any).goal_weight_kg} kg` : labelForTrainingGoal((data.profile as any)?.training_goal)}
              hint={(data as any).coaching_goal ? `Coaching: ${(data as any).coaching_goal}` : "Coaching-Ziel"}
            />
            <CockpitStat
              label="Nächster Check-in"
              value={nextCheckinDate ? nextCheckinDate.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) : "Nicht geplant"}
              hint={checkinDays == null ? "Termin festlegen" : checkinDays < 0 ? `${Math.abs(checkinDays)} Tage überfällig` : checkinDays === 0 ? "Heute" : `in ${checkinDays} Tagen`}
            />
            <CockpitStat
              label="Letzte Aktivität"
              value={lastActivityDate ? lastActivityDate.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) : "—"}
              hint={inactiveDays == null ? "Keine Aktivität erfasst" : inactiveDays === 0 ? "Heute aktiv" : `vor ${inactiveDays} Tagen`}
            />
          </div>

          <section className="rounded-2xl border border-border bg-card p-5 sm:p-6">
            <div className="flex flex-wrap items-start justify-between gap-3">
              <div>
                <p className="text-[10px] font-bold uppercase tracking-[0.18em] text-muted-foreground">Coach-Fokus</p>
                <h2 className="mt-1 font-display text-xl font-bold">Heute relevant</h2>
                <p className="mt-1 text-sm text-muted-foreground">Maximal drei Punkte, die eine Entscheidung oder Aktion brauchen.</p>
              </div>
              {visibleFocusItems.length === 0 && (
                <span className="rounded-full bg-gold/10 px-3 py-1 text-xs font-semibold text-gold">Alles im grünen Bereich</span>
              )}
            </div>
            {visibleFocusItems.length > 0 ? (
              <div className="mt-4 grid gap-3 lg:grid-cols-3">
                {visibleFocusItems.map((item) => (
                  <div key={`${item.title}-${item.action}`} className="rounded-xl border border-warning/30 bg-warning/5 p-4">
                    <p className="text-sm font-semibold">{item.title}</p>
                    <p className="mt-1 text-xs text-muted-foreground">{item.detail}</p>
                    <Button type="button" variant="outline" size="sm" className="mt-3" onClick={() => setActiveTab(item.tab)}>
                      {item.action}
                    </Button>
                  </div>
                ))}
              </div>
            ) : (
              <p className="mt-4 text-sm text-muted-foreground">Aktuell gibt es keinen akuten Handlungsbedarf. Du kannst direkt in Ernährung, Training oder Kommunikation springen.</p>
            )}
          </section>

          <section className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <QuickAction label="Ernährungsplan" description="Targets, Plan und Verlauf" onClick={() => setActiveTab("ernaehrung")} />
            <QuickAction label="Trainingsplan" description="Plan, Alerts und Strength Check" onClick={() => setActiveTab("training")} />
            <QuickAction label="Check-in auswerten" description="Fortschritt, Fotos und Check-ins" onClick={() => setActiveTab("fortschritt")} />
            <QuickAction label="Nachricht senden" description="Direkt in den Kundenthread" onClick={() => setActiveTab("messages")} />
          </section>

          <SectionErrorBoundary label="Letzte Aktivität">
            <CustomerRecentActivityCard userId={userId} />
          </SectionErrorBoundary>
        </div>
      )}

      <Accordion
        type="multiple"
        value={tabSections}
        className={activeTab === "overview" ? "hidden" : "space-y-3 [&>[data-state=closed]]:hidden"}
      >'''
          text, count = header_pattern.subn(new_header, text, count=1)
          assert count == 1, f'header replacement count={count}'

          # Remove the duplicate goal projection from the admin/stammdaten area; keep it in Training.
          text, count = re.subn(
            r'''\n\s*<GoalProjectionCard\n\s*profile=\{\(data\.profile as any\) \?\? \{\}\}\n\s*currentWeight=\{\(latestWeightMeasurement as any\)\?\.weight_kg \?\? null\}\n\s*/>\n\n+\s*<AthleteProfileEditor''',
            '\n\n            <AthleteProfileEditor',
            text,
            count=1,
          )
          assert count == 1, f'duplicate goal projection removal count={count}'

          # Recent activity now lives in the Overview cockpit, not at the bottom of progress.
          recent_activity = '''            <SectionErrorBoundary label="Letzte Aktivität">
              <CustomerRecentActivityCard userId={userId} />
            </SectionErrorBoundary>
'''
          assert recent_activity in text, 'progress recent activity block not found'
          text = text.replace(recent_activity, '', 1)

          # Keep technical access diagnostics available, but out of the normal coaching flow.
          debug_line = '''            <UserAccessDebugCard userId={userId} />'''
          assert debug_line in text, 'debug card not found'
          text = text.replace(
            debug_line,
            '''            <details className="rounded-xl border border-border bg-secondary/20 p-4">
              <summary className="cursor-pointer text-xs font-semibold uppercase tracking-wider text-muted-foreground">
                Technische Diagnose
              </summary>
              <div className="mt-4">
                <UserAccessDebugCard userId={userId} />
              </div>
            </details>''',
            1,
          )

          # Payment history must remain usable on narrow mobile screens.
          payment_table = '''                <table className="mt-4 w-full text-sm">'''
          assert payment_table in text, 'payment table not found'
          text = text.replace(payment_table, '''                <div className="mt-4 overflow-x-auto">
                  <table className="min-w-[720px] w-full text-sm">''', 1)
          payment_end_anchor = '''                </table>
              )}
            </div>
          </AccordionContent>'''
          assert payment_end_anchor in text, 'payment table end not found'
          text = text.replace(payment_end_anchor, '''                  </table>
                </div>
              )}
            </div>
          </AccordionContent>''', 1)

          helper_anchor = '''function MeasurementsCard({ measurements }: { measurements: any[] }) {'''
          assert helper_anchor in text, 'helper anchor not found'
          helpers = '''function CockpitStat({ label, value, hint }: { label: string; value: string; hint: string }) {
  return (
    <div className="rounded-2xl border border-border bg-card p-4">
      <p className="text-[10px] font-bold uppercase tracking-[0.16em] text-muted-foreground">{label}</p>
      <p className="mt-1 font-display text-xl font-bold">{value}</p>
      <p className="mt-1 text-xs text-muted-foreground">{hint}</p>
    </div>
  );
}

function QuickAction({ label, description, onClick }: { label: string; description: string; onClick: () => void }) {
  return (
    <button
      type="button"
      onClick={onClick}
      className="rounded-2xl border border-border bg-card p-4 text-left transition-colors hover:border-foreground/20 hover:bg-secondary/30"
    >
      <p className="text-sm font-semibold">{label}</p>
      <p className="mt-1 text-xs text-muted-foreground">{description}</p>
    </button>
  );
}

'''
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow from final branch
        run: rm .github/workflows/customer-cockpit-build.yml

      - name: Install dependencies without rewriting lockfile
        run: npm install --ignore-scripts --package-lock=false

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified cockpit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/coach.customers.\$userId.tsx .github/workflows/customer-cockpit-build.yml
          git commit -m "feat: turn customer detail into coach cockpit"
          git push origin HEAD:feature/customer-coach-cockpit
