name: Verify Live Static Service Worker

on:
  push:
    branches:
      - ops/verify-live-static-sw

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production static service worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            status=$(curl -sS -o /tmp/sw.js -w '%{http_code}' https://bodyfuel-coaching.com/sw.js || true)
            content_type=$(curl -sSI https://bodyfuel-coaching.com/sw.js | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}' | tail -1)
            echo "attempt=$attempt status=$status content-type=$content_type"
            if [ "$status" = "200" ] && grep -Fq 'BodyFuel static service worker' /tmp/sw.js; then
              echo 'Live static service worker verified.'
              curl -sS https://bodyfuel-coaching.com/manifest.webmanifest | grep -F 'BodyFuel Coaching'
              exit 0
            fi
            sleep 15
          done
          echo 'Production did not publish the static service worker in time.'
          echo '--- final response ---'
          head -c 500 /tmp/sw.js || true
          exit 1
