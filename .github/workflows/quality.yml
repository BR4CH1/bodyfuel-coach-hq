name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint changed source files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              '*.js' '*.jsx' '*.mjs' '*.ts' '*.tsx'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed source files to lint."
            exit 0
          fi

          npx eslint "${changed_files[@]}"

      - name: Check build safeguards
        run: |
          npm run check:build-memory
          npm run check:browser-only-imports

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
