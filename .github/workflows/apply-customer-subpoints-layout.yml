name: Apply customer subpoint layout refactor

on:
  push:
    branches:
      - refactor/customer-subpoints-layout
    paths:
      - .github/workflows/apply-customer-subpoints-layout.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/customer-subpoints-layout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply targeted layout refactor
        run: python3 .github/scripts/apply-customer-subpoints-layout.py

      - name: Install dependencies without lockfile mutation
        run: npm install --ignore-scripts --package-lock=false

      - name: Layout regression test
        run: npx vitest run src/lib/__tests__/customer-subpoints-layout.test.ts src/lib/__tests__/customer-subpoints-consistency.test.ts src/lib/__tests__/nutrition-tracker-targets.logic.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Remove temporary automation
        run: |
          rm -f .github/scripts/apply-customer-subpoints-layout.py
          rm -f .github/workflows/apply-customer-subpoints-layout.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit validated layout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: streamline coach customer subpoints"
          git push origin HEAD:refactor/customer-subpoints-layout
