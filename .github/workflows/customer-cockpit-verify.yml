name: Verify customer coach cockpit

on:
  push:
    branches:
      - feature/customer-coach-cockpit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --check
