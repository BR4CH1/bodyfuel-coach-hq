name: MCP training plan verify

on:
  push:
    branches:
      - feature/mcp-training-plan-writes

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Focused MCP tests
        run: npx vitest run src/lib/mcp/__tests__/coach-training-plan-write.test.ts src/lib/mcp/__tests__/coach-access.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Generated MCP manifest stays in sync
        run: git diff --exit-code -- .lovable/mcp/manifest.json src/routes/mcp.ts
      - name: Diff whitespace check
        run: git diff --check
