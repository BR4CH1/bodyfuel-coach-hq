name: Native App Bootstrap

on:
  push:
    branches:
      - feature/native-app-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install existing dependencies
        run: npm ci

      - name: Install Capacitor 8
        run: |
          npm install --save @capacitor/core@^8 @capacitor/android@^8 @capacitor/ios@^8
          npm install --save-dev @capacitor/cli@^8

      - name: Add native npm scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.scripts = {
            ...pkg.scripts,
            'build:native': 'node scripts/build-native.mjs',
            'cap:sync': 'npm run build:native && cap sync',
            'cap:android': 'npm run build:native && cap sync android',
            'cap:ios': 'npm run build:native && cap sync ios',
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Build native web assets
        run: npm run build:native

      - name: Create Android project
        run: npx cap add android

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync native projects
        run: npx cap sync

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Web production build
        run: npm run build

      - name: Android debug build
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Commit generated native projects
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android ios
          if git diff --cached --quiet; then
            echo "No generated native changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap Capacitor Android and iOS projects"
          git push origin HEAD:feature/native-app-foundation
