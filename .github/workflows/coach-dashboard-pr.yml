name: Coach dashboard PR verification

on:
  push:
    branches:
      - feature/coach-dashboard-cockpit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Targeted coach dashboard tests
        run: >-
          npx vitest run
          src/features/coach-dashboard/lib/__tests__/coach-today.logic.test.ts
          src/features/coach-dashboard/lib/__tests__/coach-workload.logic.test.ts
          src/features/coach-dashboard/lib/__tests__/coach-dashboard.logic.test.ts
          src/features/coach-dashboard/lib/__tests__/coach-intelligence.logic.test.ts
          src/features/coach-dashboard/lib/__tests__/coach-followups.logic.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build
