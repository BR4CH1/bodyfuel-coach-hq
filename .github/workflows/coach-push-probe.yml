name: Coach Push Verification

on:
  push:
    branches:
      - feature/coach-web-push

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coach-web-push
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Wire event triggers and dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['dependencies']['web-push'] = '3.6.7'
          data['devDependencies']['@types/web-push'] = '3.6.4'
          package.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          messages = Path('src/lib/coach-messages.functions.ts')
          text = messages.read_text()
          if 'title: "Neue Kundennachricht"' not in text:
              start = text.index('// === Client: send to coach ===')
              end = text.index('// === Client: get own thread ===')
              section = text[start:end]
              needle = '    if (error) throw new Error(error.message);\n    return { ok: true };'
              insert = '''    if (error) throw new Error(error.message);

    // Push is best-effort and must never make a stored message appear failed.
    try {
      const { getPushActorName, notifyEnabledCoaches } = await import("@/lib/coach-push.server");
      const name = await getPushActorName(context.userId);
      await notifyEnabledCoaches({
        title: "Neue Kundennachricht",
        body: `${name} hat dir eine neue Nachricht geschickt.`,
        url: "/coach",
        tag: `message-${context.userId}-${Date.now()}`,
      });
    } catch (pushError) {
      console.warn("[coach-push] message notification failed", pushError);
    }
    return { ok: true };'''
              if needle not in section:
                  raise SystemExit('Could not wire coach message push trigger')
              text = text[:start] + section.replace(needle, insert, 1) + text[end:]
              messages.write_text(text)

          checkin = Path('src/routes/check-in.tsx')
          text = checkin.read_text()
          if 'import { useServerFn } from "@tanstack/react-start";' not in text:
              text = text.replace(
                  'import { createFileRoute } from "@tanstack/react-router";\n',
                  'import { createFileRoute } from "@tanstack/react-router";\nimport { useServerFn } from "@tanstack/react-start";\n', 1)
          if 'import { notifyCoachCheckinSubmitted }' not in text:
              text = text.replace(
                  'import { useFormDraft, clearFormDraft } from "@/hooks/use-form-draft";\n',
                  'import { useFormDraft, clearFormDraft } from "@/hooks/use-form-draft";\nimport { notifyCoachCheckinSubmitted } from "@/lib/coach-push.functions";\n', 1)
          if 'const notifyCoachCheckin = useServerFn(notifyCoachCheckinSubmitted);' not in text:
              text = text.replace(
                  'function WeeklyCheckIn() {\n',
                  'function WeeklyCheckIn() {\n  const notifyCoachCheckin = useServerFn(notifyCoachCheckinSubmitted);\n', 1)
          if 'notifyCoachCheckin({ data: { weekStart: week } })' not in text:
              needle = '      toast.success(existingId ? "Check-in aktualisiert" : "Check-in gespeichert");'
              insert = '''      toast.success(existingId ? "Check-in aktualisiert" : "Check-in gespeichert");
      if (!existingId) {
        void notifyCoachCheckin({ data: { weekStart: week } }).catch(() => {
          // Check-in is already stored; Push delivery remains best-effort.
        });
      }'''
              if needle not in text:
                  raise SystemExit('Could not wire check-in push trigger')
              text = text.replace(needle, insert, 1)
          checkin.write_text(text)
          PY

      - run: npm install --ignore-scripts
      - name: Format changed product files
        run: |
          npx prettier --write package.json src/lib/coach-push.server.ts src/lib/coach-push.functions.ts src/lib/coach-messages.functions.ts src/routes/check-in.tsx src/features/coach-dashboard/components/CoachPushCard.tsx src/features/coach-dashboard/components/CoachDashboardPage.tsx public/coach-push-sw.js vite.config.ts
      - name: Commit generated lock and wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src public/coach-push-sw.js vite.config.ts supabase/migrations/20260814152000_coach_push_subscriptions.sql
          if ! git diff --cached --quiet; then
            git commit -m "feat: wire coach push events and dependencies"
            git push origin HEAD:feature/coach-web-push
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify generated service worker imports push handler
        run: grep -F 'coach-push-sw.js' .output/public/sw.js
