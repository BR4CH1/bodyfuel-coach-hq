name: Coach Push Runtime Probe

on:
  push:
    branches:
      - feature/coach-web-push

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Collect generated worker config
        run: |
          mkdir -p push-probe
          cp .output/server/wrangler.json push-probe/wrangler.json
          cp .wrangler/deploy/config.json push-probe/deploy-config.json
          node -e "const f=require('./push-probe/wrangler.json'); console.log(JSON.stringify({compatibility_date:f.compatibility_date,compatibility_flags:f.compatibility_flags},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: coach-push-runtime-config
          path: push-probe
          if-no-files-found: error
