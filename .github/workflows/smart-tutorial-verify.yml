name: Smart tutorial verify

on:
  push:
    branches:
      - feature/smart-first-login-tutorial

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-first-login-tutorial
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply focused integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          layout_path = Path("src/components/bodyfuel/AppLayout.tsx")
          layout = layout_path.read_text()
          old_gate = '        navigate({ to: "/onboarding/smart" });'
          new_gate = '        navigate({ to: "/onboarding/smart-start" });'
          if layout.count(old_gate) != 1:
              raise SystemExit(f"Expected exactly one Smart gate redirect, found {layout.count(old_gate)}")
          layout_path.write_text(layout.replace(old_gate, new_gate, 1))

          profile_path = Path("src/routes/profile.tsx")
          profile = profile_path.read_text()
          anchor = '      {/* Check-in-Ergebnisse werden jetzt direkt unter /check-in angezeigt. */}'
          if profile.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one profile anchor, found {profile.count(anchor)}")
          smart_card = '''      {String(pkg?.package ?? "").toLowerCase() === "smart" && (\n        <section className="rounded-2xl border border-gold/25 bg-gradient-to-br from-gold/10 via-card to-card p-6">\n          <div className="flex items-start gap-4">\n            <div className="grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-gold/30 bg-gold/10 text-gold">\n              <Sparkles className="h-5 w-5" />\n            </div>\n            <div className="min-w-0 flex-1">\n              <h2 className="font-display text-lg font-bold">Smart Tutorial</h2>\n              <p className="mt-1 text-sm leading-5 text-muted-foreground">\n                Einführung, Smart Nutrition und automatische Plan-Erstellung noch einmal ansehen. Deine gespeicherten Angaben bleiben dabei unverändert.\n              </p>\n              <Button className="mt-4" variant="secondary" onClick={() => navigate({ to: "/onboarding/smart-start" })}>\n                <Sparkles className="mr-2 h-4 w-4" /> Tutorial erneut starten\n              </Button>\n            </div>\n          </div>\n        </section>\n      )}\n\n'''
          profile_path.write_text(profile.replace(anchor, smart_card + anchor, 1))
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Production build and route generation
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Commit verified integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/bodyfuel/AppLayout.tsx src/routes/profile.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Integrate Smart first-login tutorial"
            git push origin HEAD:feature/smart-first-login-tutorial
          fi
